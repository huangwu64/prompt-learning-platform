# 前后端分离：静态资源 + /api 反向代理
server {
    listen 80;
    server_name _;

    # 上传文件上限需与后端 spring.servlet.multipart.max-file-size 保持一致（头像 2MB）
    client_max_body_size 4m;

    # 前端 React 静态资源
    root /usr/share/nginx/html;
    index index.html;

    # 前端路由（React Router 历史模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;

        # AI 助手是 SSE 长连接：默认 60s 会在长回复中途断开
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 【关键】默认开启的响应缓冲会把 SSE 攒起来一次性下发，
        # 「逐字输出」在生产环境会退化成「整段蹦出」。必须关掉。
        proxy_buffering off;
        proxy_cache off;
        # 告知上游不要启用压缩缓冲（与 proxy_buffering off 配合）
        proxy_set_header X-Accel-Buffering no;
    }

    # 用户上传的文件（头像）。
    # 用 ^~ 阻断下面的静态资源正则 —— 否则 /uploads/*.png 会被 regex location
    # 抢先匹配，从 nginx 本地目录找文件而 404。
    location ^~ /uploads/ {
        proxy_pass http://backend:8080/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 1d;
        add_header Cache-Control "public";
    }

    # 注意：不再暴露 /actuator/。
    # prometheus 端点已从 management.endpoints.web.exposure 移除，
    # 其余端点在后端要求 ADMIN 角色；通过 nginx 转发只会平白扩大攻击面。
    # 需要看指标请走后台「监控」页（/api/admin/monitor/*）。

    # 静态资源缓存（注意：/uploads/ 已用 ^~ 单独处理，不会落到这里）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
